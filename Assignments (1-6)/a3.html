<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Assignment 3</h3>
    <script>
      let score = Number(prompt("Enter your score:"));
     if(score >= 0 && score <=100){
      let gradeCategory = 0;
      if(score>=90 && score <=100){
        gradeCategory = 1;
      }
      else if(score>=80 && score < 90){
        gradeCategory = 2;
      }
      else if(score>=70 && score < 80){
        gradeCategory = 3;
      }
      else if(score>=60 && score < 70){
        gradeCategory = 4;
      }
      else{
        gradeCategory = 5;
      }

      let grade= "";
      switch(gradeCategory){
        case 1 : grade ="A";
        break;
        case 2 : grade ="B";
        break;
        case 3 : grade ="C";
        break;
        case 4 : grade ="D";
        break;
        case 5 : grade = "F";
        break;

        default: 
        grade = "Invalid Category";
        break;
      }

      let status = score >= 40 ? "Passed" : "Failed" ;

      document.write("Score: "+ score + "<br>");
      document.write("Grade: "+grade + "<br>");
      document.write("Status: "+ status + "<br>");
    }
    else{
        document.write("Invalid marks. Enter a score between 0 to 100");
    }
    </script>
    
</body>
</html>
